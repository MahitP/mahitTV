# Publishes mahitTV's web app (web/, built as the browser preview) to GitHub Pages at https://tv.mahit.dev whenever main
# changes. Built with --generic: no config.properties, so no keys, PINs or family photos ever reach the site.
name: Website

on:
  push:
    branches: [main]
    paths: ["web/**", "preview/**", "app/assets/**", "tools/webapp.py", "webos/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the web app
        run: |
          python3 webos/build.py --preview --generic
          rm -rf out/webos/profiles
          echo "tv.mahit.dev" > out/webos/CNAME
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/webos
      - id: deployment
        uses: actions/deploy-pages@v5

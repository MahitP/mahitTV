<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>mahitTV</title>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="house.css">
<link rel="stylesheet" href="welly.css">
<link rel="stylesheet" href="lock.css">
</head>
<body>
<script>
  // The look the home screen last had, before anything is drawn, so a night start doesn't flash the day one first.
  try {
    if (localStorage.getItem('fmtv.night') === 'true') {
      document.documentElement.style.background = '#0B0B0D';
      document.body.className = 'night';
    }
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <div id="art"><div id="photoA" class="photo"></div><div id="photoB" class="photo"></div></div>
    <div class="scrim"></div>
    <div id="blur"><canvas id="bgA" width="48" height="27"></canvas><canvas id="bgB" width="48" height="27"></canvas></div>
    <div class="veil"></div>
    <div class="lift"></div>
    <div class="shade"></div>
  </div>
  <div id="home" class="layer">
    <div id="tv" class="layer">
      <div id="shelftop" class="layer">
        <div id="hero"><img class="logo" alt=""><h1></h1></div>
        <div id="details"><div class="meta"></div><div class="overview"></div><button id="watch"></button></div>
        <div id="dots"></div>
        <div id="chevron"></div>
      </div>
      <div id="platter"><canvas class="bleed" width="48" height="27"></canvas><div class="tint"></div></div>
      <div id="shadows"></div>
      <div id="tiles"></div>
      <div id="dockname"></div>
    </div>
    <div id="top" class="layer">
      <div id="quotes"></div>
      <div id="pill"><span class="time"></span><span class="avatar"></span></div>
      <div id="buttons"></div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
    </div>
  </div>
  <div id="dim" class="layer"></div>
  <div id="house" class="layer"><canvas width="1920" height="1080"></canvas><div class="pill"><span class="n"></span><span class="s"></span></div></div>
  <div id="welly" class="layer"></div>
  <div id="tabs"></div>
  <div id="drawer"><canvas class="bleed" width="48" height="27"></canvas><div class="tint"></div><div class="body"></div></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="about" class="layer sheet"><div class="box"></div></div>
  <div id="saver" class="layer"></div>
  <div id="lock" class="layer"></div>
  <div id="intro" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="motion.js"></script>
<script src="zones.js"></script>
<script src="profiles.js"></script>
<script src="data.js"></script>
<script src="house-data.js"></script>
<script src="welly-preview-data.js"></script>
<script src="rooms.js"></script>
<script src="welly-bot.js"></script>
<script src="welly.js"></script>
<script src="intro.js"></script>
<script src="lock.js"></script>
<script src="home.js"></script>
</body>
</html>
